<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esforço por Squad &amp; Pessoa · B2C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@320;330;340;400;480;540;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF; --card: #FFFFFF; --ink: #000000; --ink-soft: #000000; --ink-faint: #6B6B6B;
    --line: #E6E6E6; --line-soft: #F1F1F1; --surface-soft: #F7F7F5;
    --money: #1EA64A; --money-deep: #146631; --money-wash: #C8E6CD;
    --amber: #000000; --amber-wash: #F4ECD6; --amber-line: #E6E6E6;
    --red: #000000; --red-wash: #F3C9B6; --red-line: #E6E6E6;
    --magenta: #FF3D8B;
    --radius: 24px; --radius-sm: 8px; --pill: 50px; --shadow: none;
  }
  /* Alternador de visão, integrado ao masthead */
  .mh-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 5px; }
  .mh-switch { display: flex; gap: 6px; flex-shrink: 0; margin-top: 12px; }
  .mh-tab { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 480; letter-spacing: .01em; color: var(--ink); padding: 9px 18px; border-radius: var(--pill); text-decoration: none; border: 1px solid var(--ink); background: var(--card); transition: all .15s; white-space: nowrap; }
  .mh-tab:hover { background: var(--surface-soft); }
  .mh-tab.active { background: var(--ink); border-color: var(--ink); color: #fff; }

  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; padding:0 18px 60px; }
  .wrap { max-width:1080px; margin:0 auto; padding-top:24px; }
  .mono { font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }

  .searchbar { position:sticky; top:0; z-index:40; background:var(--bg); padding:14px 0 12px; margin:0 -18px 4px; border-bottom:1px solid var(--line); }
  .searchbar-inner { max-width:1080px; margin:0 auto; padding:0 18px; position:relative; }
  .search-input-wrap { position:relative; }
  .search-input-wrap .icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:15px; pointer-events:none; }
  #globalSearch { width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:11px 14px 11px 40px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:var(--card); box-shadow:var(--shadow); }
  #globalSearch:focus { outline:2px solid var(--money); outline-offset:1px; border-color:transparent; }
  #globalSearch::placeholder { color:var(--ink-faint); }
  .ac-list { position:absolute; left:18px; right:18px; top:calc(100% + 6px); background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 28px rgba(0,0,0,.12); max-height:380px; overflow-y:auto; display:none; z-index:45; }
  .ac-list.open { display:block; }
  .ac-item { padding:11px 15px; cursor:pointer; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .ac-item:last-child { border-bottom:none; }
  .ac-item:hover,.ac-item.active { background:var(--money-wash); }
  .ac-item .ac-title { font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ac-item .ac-title mark { background:#FBE7A8; padding:0 1px; border-radius:2px; }
  .ac-item .ac-meta { flex-shrink:0; text-align:right; }
  .ac-item .ac-squad { font-size:10.5px; color:var(--ink-faint); padding:1px 7px; border:1px solid var(--line); border-radius:10px; white-space:nowrap; }
  .ac-item .ac-cost { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--money-deep); margin-top:3px; }
  .ac-empty { padding:16px 15px; font-size:13px; color:var(--ink-faint); text-align:center; }
  .flash { animation:flash 1.6s ease; }
  @keyframes flash { 0%,40%{ box-shadow:0 0 0 2px var(--money),var(--shadow); } 100%{ box-shadow:var(--shadow); } }

  .masthead { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .masthead .eyebrow { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; margin-bottom:5px; }
  .masthead h1 { font-family:'Inter',sans-serif; font-weight:700; font-size:25px; letter-spacing:-.01em; }
  .masthead .meta { font-size:12px; color:var(--ink-faint); text-align:right; }
  .masthead .meta .mono { color:var(--ink-soft); }

  .tabs { display:flex; gap:7px; margin-bottom:18px; }
  .tab { font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:8px 16px; border-radius:20px; cursor:pointer; background:var(--card); border:1px solid var(--line); color:var(--ink-soft); transition:all .13s; }
  .tab:hover { border-color:var(--ink); color:var(--ink); }
  .tab.active { background:var(--money-deep); border-color:var(--money-deep); color:#fff; }

  .crumb { display:flex; align-items:center; gap:10px; margin-bottom:18px; font-size:13px; }
  .crumb button { font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--money); background:transparent; border:none; cursor:pointer; padding:0; display:inline-flex; align-items:center; gap:5px; }
  .crumb button:hover { text-decoration:underline; }
  .crumb .sep { color:var(--ink-faint); } .crumb .cur { color:var(--ink); font-weight:600; }

  .strip { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:14px; }
  .strip .cell { background:var(--card); padding:16px 18px; }
  .strip .l { font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; margin-bottom:7px; }
  .strip .v { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px; letter-spacing:-.02em; }
  .strip .v.money { color:var(--money-deep); }
  .strip .v small { font-size:13px; color:var(--ink-faint); font-weight:400; }

  /* Tooltip por CLIQUE */
  .info { display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:50%; border:1px solid var(--ink-faint); color:var(--ink-faint); font-size:10px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; vertical-align:middle; -webkit-tap-highlight-color:transparent; }
  .info:hover,.info.on { border-color:var(--ink); color:var(--ink); }
  .tipbox { position:fixed; z-index:80; max-width:300px; background:var(--ink); color:#fff; font-size:12.5px; font-weight:400; line-height:1.55; letter-spacing:normal; text-transform:none; text-align:left; padding:13px 15px; border-radius:10px; box-shadow:0 10px 34px rgba(0,0,0,.28); display:none; }
  .tipbox.open { display:block; }
  .tipbox b { color:#fff; }
  .tip-backdrop { position:fixed; inset:0; z-index:79; display:none; }
  .tip-backdrop.open { display:block; }

  .honesty { background:var(--amber-wash); border:1px solid var(--amber-line); border-radius:var(--radius); padding:13px 18px; margin-bottom:24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .honesty .gtext { flex:1; min-width:200px; font-size:13px; color:#6B5220; }
  .honesty .gtext strong { color:var(--amber); }
  .connfail { background:var(--red-wash); border:1px solid var(--red-line); border-radius:var(--radius); padding:13px 18px; margin-bottom:16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .connfail .dot { width:9px; height:9px; border-radius:50%; background:var(--red); flex:none; box-shadow:0 0 0 4px rgba(192,57,43,.14); }
  .connfail .ctext { flex:1; min-width:220px; font-size:13px; color:#7A2E23; }
  .connfail .ctext strong { color:var(--red); } .connfail .ctext .why { display:block; margin-top:3px; font-size:11.5px; color:#9A5B50; }
  .connfail button { font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; color:var(--red); background:transparent; border:1px solid var(--red-line); padding:7px 13px; border-radius:8px; cursor:pointer; }

  .section-title { font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:400; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); margin:4px 0 12px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .navcard { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; cursor:pointer; transition:all .15s; box-shadow:var(--shadow); text-align:left; font-family:inherit; width:100%; }
  .navcard:hover { border-color:var(--ink); }
  .navcard .nhead { font-family:'Inter',sans-serif; font-size:16px; font-weight:600; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .navcard .nhead .arrow { color:var(--ink-faint); font-size:15px; transition:transform .15s; flex:none; }
  .navcard:hover .nhead .arrow { transform:translateX(3px); color:var(--money); }
  .navcard .nsub { font-size:11.5px; color:var(--ink-faint); margin-bottom:14px; }
  .navcard .metrics { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  .navcard .m .mv { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; letter-spacing:-.01em; white-space:nowrap; }
  .navcard .m .mv.money { color:var(--money-deep); }
  .navcard .m .ml { font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; white-space:nowrap; }

  .badge { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; padding:2px 8px; border-radius:9px; white-space:nowrap; }
  .badge.good { background:var(--money-wash); color:var(--money-deep); }
  .badge.mid  { background:var(--amber-wash); color:var(--amber); }
  .badge.low  { background:var(--red-wash); color:var(--red); }

  .dhead { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px 24px; margin-bottom:18px; box-shadow:var(--shadow); }
  .dhead h2 { font-family:'Inter',sans-serif; font-size:22px; font-weight:700; margin-bottom:14px; }
  .dhead .row { display:flex; gap:30px; flex-wrap:wrap; }
  .dhead .m .mv { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px; }
  .dhead .m .mv.money { color:var(--money-deep); }
  .dhead .m .ml { font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; display:flex; align-items:center; gap:5px; }

  .tbl-wrap { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tbl-wrap table { min-width: 560px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th { text-align:left; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; padding:13px 14px; border-bottom:1px solid var(--line); background:#FBFCFB; white-space:nowrap; cursor:pointer; user-select:none; }
  thead th.num { text-align:right; }
  thead th .arw { color:var(--money); font-size:10px; }
  tbody td { padding:12px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover { background:#FBFCFB; }
  td.num { text-align:right; font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }
  td .nm { font-weight:500; } td .sq { font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .money-txt { color:var(--money-deep); font-weight:600; }
  .gap-pos { color:var(--red); font-weight:600; }
  .semtar { font-size:11px; color:var(--amber); font-style:italic; }
  .clickrow { cursor:pointer; }
  .cap-bar { display:inline-block; width:50px; height:7px; border-radius:4px; background:var(--line); position:relative; overflow:hidden; vertical-align:middle; margin-left:8px; }
  .cap-bar > i { position:absolute; left:0; top:0; bottom:0; border-radius:4px; }
  .cap-bar > i.good{ background:var(--money);} .cap-bar > i.mid{ background:var(--amber);} .cap-bar > i.low{ background:var(--red);}

  .state { text-align:center; padding:80px 20px; color:var(--ink-soft); }
  .state h2 { font-family:'Inter',sans-serif; font-size:18px; margin-bottom:10px; color:var(--ink); }
  .state code { font-family:'JetBrains Mono',monospace; font-size:12.5px; background:#fff; padding:2px 6px; border-radius:5px; border:1px solid var(--line); }
  .spinner { width:30px; height:30px; border:3px solid var(--line); border-top-color:var(--money); border-radius:50%; margin:0 auto 20px; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg);} }

  @media (max-width:720px){ .strip{ grid-template-columns:1fr 1fr;} .grid{ grid-template-columns:1fr;} .dhead .row{ gap:18px;} table{ font-size:12.5px;} thead th,tbody td{ padding:10px 9px;}
    .tbl-wrap{ position:relative; }
    .tbl-wrap::after{ content:''; position:absolute; top:0; right:0; bottom:0; width:22px; pointer-events:none; background:linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,.95)); }
  }
</style>
</head>
<body>
<div class="searchbar"><div class="searchbar-inner">
  <div class="search-input-wrap"><span class="icon">&#9906;</span>
    <input type="text" id="globalSearch" placeholder="Buscar pessoa pelo nome&hellip;" autocomplete="off" spellcheck="false"></div>
  <div class="ac-list" id="acList"></div>
</div></div>
<div class="wrap"><div id="app"><div class="state"><div class="spinner"></div><p>Carregando dados do ledger&hellip;</p></div></div></div>
<div class="tip-backdrop" id="tipBackdrop" onclick="fecharTip()"></div>
<div class="tipbox" id="tipBox"></div>

<script>
const ENDPOINT = "https://n8n-homolog.b2.club/webhook/esforco-sprint-dashboard";
const CAP = 54; // 9 dias uteis x 6h (2 meios-dias de cerimonia descontados)

const brl0 = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const brl2 = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
const numf = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1});
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function faixa(t){ return t>=70?'good':(t>=40?'mid':'low'); }

let DATA=null, fetchErro=null;
let view='squads';           // squads | pessoas | squadDetail | pessoaDetail
let squadAtual=null, pessoaAtual=null;
let ordTbl={campo:'horasTotal',dir:-1};

async function carregar(){
  try{
    const r=await fetch(ENDPOINT,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status+' '+r.statusText);
    let d=await r.json(); if(Array.isArray(d)) d=d[0];
    if(!d||!d.porSquad||!d.porPessoa) throw new Error('resposta sem o formato esperado');
    DATA=d; fetchErro=null; render();
  }catch(e){ console.warn('Fallback embutido:',e.message); DATA=__PV__; fetchErro=e.message; render(); }
}
function tentarNovamente(){ carregar(); }

// ===== TOOLTIPS POR CLIQUE =====
const TIPS = {
  apont: 'Horas apontadas &divide; capacidade da sprint, na média das sprints da pessoa. Capacidade = <b>54h</b> (9 dias úteis &times; 6h, já descontados os 2 meios-dias de cerimônia). Taxa baixa pode ser folga real <b>ou</b> apontamento incompleto &mdash; trabalho feito e não registrado. Investigue antes de concluir.',
  efetivo: 'Duas leituras da mesma hora:<br><br><b>Deveria custar</b> = salário &divide; capacidade (a hora <i>disponível</i>, valor fixo).<br><br><b>Custou de fato</b> = salário das sprints participadas &divide; horas de fato apontadas. Se a pessoa aponta menos que a capacidade, cada hora entregue sai mais cara. A diferença é o custo da capacidade que não virou apontamento.'
};
let tipAtual=null;
function toggleTip(ev, key){
  ev.stopPropagation();
  const box=document.getElementById('tipBox'), bd=document.getElementById('tipBackdrop'), el=ev.currentTarget;
  if(tipAtual===el){ fecharTip(); return; }
  document.querySelectorAll('.info.on').forEach(i=>i.classList.remove('on'));
  el.classList.add('on'); tipAtual=el;
  box.innerHTML=TIPS[key]||''; box.classList.add('open'); bd.classList.add('open');
  // posiciona perto do alvo, sem estourar a tela
  const r=el.getBoundingClientRect(), bw=Math.min(300,window.innerWidth-24);
  box.style.maxWidth=bw+'px';
  let left=r.left+r.width/2-bw/2;
  left=Math.max(12,Math.min(left,window.innerWidth-bw-12));
  box.style.left=left+'px';
  // acima se couber, senao abaixo
  const bh=box.offsetHeight;
  let top=r.top-bh-10;
  if(top<12) top=r.bottom+10;
  box.style.top=top+'px';
}
function fecharTip(){ const box=document.getElementById('tipBox'),bd=document.getElementById('tipBackdrop');
  box.classList.remove('open'); bd.classList.remove('open');
  document.querySelectorAll('.info.on').forEach(i=>i.classList.remove('on')); tipAtual=null; }
function I(key){ return `<span class="info" onclick="toggleTip(event,'${key}')">i</span>`; }
window.addEventListener('scroll',()=>{ if(tipAtual) fecharTip(); }, true);

function render(){
  if(view==='squads') renderSquads();
  else if(view==='pessoas') renderPessoas();
  else if(view==='squadDetail') renderSquadDetail();
  else if(view==='pessoaDetail') renderPessoaDetail();
}
function masthead(){ const t=DATA.totais;
  return `<div class="masthead"><div><h1>Relatório de Custos Diretos do Time</h1><div class="mh-switch"><a class="mh-tab active" href="dashboard-horas.html">Apontamento de Horas</a><a class="mh-tab " href="index.html">Custo das Implementações</a></div></div>
    <div class="meta">atualizado<br><span class="mono">${new Date(t.geradoEm).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div></div>`; }
function connBanner(){ if(!fetchErro) return '';
  return `<div class="connfail"><span class="dot"></span><div class="ctext"><strong>Sem conexão com o n8n.</strong> Exibindo a última cópia salva &mdash; números podem estar desatualizados.<span class="why">Detalhe: ${esc(fetchErro)}</span></div><button onclick="tentarNovamente()">Tentar de novo</button></div>`; }
function tabs(a){ return `<div class="tabs"><button class="tab ${a==='squads'?'active':''}" onclick="irSquads()">Por squad</button><button class="tab ${a==='pessoas'?'active':''}" onclick="irPessoas()">Por pessoa</button></div>`; }

// ===== POR SQUAD =====
function renderSquads(){ view='squads'; fecharTip(); const t=DATA.totais;
  document.getElementById('app').innerHTML=`${masthead()}
    <div class="strip">
      <div class="cell"><div class="l">Custo apontado</div><div class="v money">${brl0.format(t.custo)}</div></div>
      <div class="cell"><div class="l">Esforço total</div><div class="v">${numf.format(t.horas)}<small> h</small></div></div>
      <div class="cell"><div class="l">Squads</div><div class="v">${t.squads}</div></div>
      <div class="cell"><div class="l">Pessoas</div><div class="v">${t.pessoas}</div></div>
    </div>${connBanner()}
    <div class="honesty"><div class="gtext"><strong>Custo apontado &ne; folha total.</strong> Mede o que foi <em>registrado</em> em Tasks/Bugs concluídos. Capacidade de referência: 54h por sprint (9 dias &times; 6h). Taxa de apontamento baixa pode indicar trabalho não lançado.</div></div>
    <div class="section-title">Escolha um squad (maior esforço primeiro)</div>
    ${tabs('squads')}
    <div class="grid">${DATA.porSquad.map(s=>{ const f=faixa(s.taxaMedia);
      return `<button class="navcard" onclick="abrirSquad('${esc(s.squad).replace(/'/g,"\\'")}')">
        <div class="nhead">${esc(s.squad)} <span class="arrow">&rarr;</span></div>
        <div class="nsub">${s.qtdPessoas} pessoas</div>
        <div class="metrics">
          <div class="m"><div class="mv money">${brl0.format(s.custo)}</div><div class="ml">custo</div></div>
          <div class="m"><div class="mv">${numf.format(s.horas)}</div><div class="ml">horas</div></div>
          <div class="m"><div class="mv"><span class="badge ${f}">${s.taxaMedia}%</span></div><div class="ml">apontamento</div></div>
        </div></button>`; }).join('')}</div>`; }

// ===== POR PESSOA =====
function renderPessoas(){ view='pessoas'; fecharTip(); const t=DATA.totais;
  document.getElementById('app').innerHTML=`${masthead()}
    <div class="strip">
      <div class="cell"><div class="l">Custo apontado</div><div class="v money">${brl0.format(t.custo)}</div></div>
      <div class="cell"><div class="l">Esforço total</div><div class="v">${numf.format(t.horas)}<small> h</small></div></div>
      <div class="cell"><div class="l">Pessoas</div><div class="v">${t.pessoas}</div></div>
      <div class="cell"><div class="l">Squads</div><div class="v">${t.squads}</div></div>
    </div>${connBanner()}
    <div class="section-title">Escolha uma pessoa (maior esforço primeiro)</div>
    ${tabs('pessoas')}
    <div class="grid">${DATA.porPessoa.map(p=>{ const f=faixa(p.taxaMedia);
      return `<button class="navcard" onclick="abrirPessoa('${esc(p.email).replace(/'/g,"\\'")}')">
        <div class="nhead">${esc(p.nome)} <span class="arrow">&rarr;</span></div>
        <div class="nsub">${esc(p.squad||'&mdash;')} &middot; ${p.nSprints} sprint(s)</div>
        <div class="metrics">

let acRes=[],acAtivo=-1;
function normStr(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function destacar(t,termo){ const e=esc(t); if(!termo) return e; const nt=normStr(t),q=normStr(termo),i=nt.indexOf(q); if(i<0) return e; return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+termo.length))+'</mark>'+esc(t.slice(i+termo.length)); }
function buscar(termo){ const q=normStr(termo); if(q.length<2) return []; return DATA.porPessoa.filter(p=>normStr(p.nome).includes(q)).slice(0,20); }
function renderAC(){ const el=document.getElementById('acList'),termo=document.getElementById('globalSearch').value;
  if(!acRes.length){ if(normStr(termo).length>=2){ el.innerHTML='<div class="ac-empty">Nenhuma pessoa encontrada.</div>'; el.classList.add('open'); } else el.classList.remove('open'); return; }
  el.innerHTML=acRes.map((p,i)=>`<div class="ac-item ${i===acAtivo?'active':''}" onmousedown="selAC(${i})"><span class="ac-title">${destacar(p.nome,termo)}</span><span class="ac-meta"><span class="ac-squad">${esc(p.squad||'&mdash;')}</span><div class="ac-cost">${brl0.format(p.custoTotal||0)}</div></span></div>`).join('');
  el.classList.add('open'); }
function selAC(i){ const p=acRes[i]; if(!p) return; document.getElementById('globalSearch').value=''; document.getElementById('acList').classList.remove('open'); acRes=[]; acAtivo=-1; abrirPessoa(p.email); }
function initBusca(){ const inp=document.getElementById('globalSearch'),el=document.getElementById('acList');
  inp.addEventListener('input',()=>{ acRes=buscar(inp.value); acAtivo=-1; renderAC(); });
  inp.addEventListener('keydown',e=>{ if(!el.classList.contains('open')) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); acAtivo=Math.min(acAtivo+1,acRes.length-1); renderAC(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); acAtivo=Math.max(acAtivo-1,0); renderAC(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(acAtivo>=0) selAC(acAtivo); else if(acRes.length) selAC(0); }
    else if(e.key==='Escape'){ el.classList.remove('open'); inp.blur(); } });
  inp.addEventListener('blur',()=>setTimeout(()=>el.classList.remove('open'),150)); }
