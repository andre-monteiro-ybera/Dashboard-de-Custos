<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custo das Implementações · B2C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@320;400;480;540;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#FFFFFF; --card:#FFFFFF; --ink:#000000; --ink-soft:#000000; --ink-faint:#6B6B6B;
    --line:#E6E6E6; --line-soft:#F1F1F1; --surface-soft:#F7F7F5;
    --money:#1EA64A; --money-deep:#146631; --money-wash:#C8E6CD;
    --gestao:#7A5AF8; --gestao-wash:#E9E3FD;
    --amber:#000000; --amber-wash:#F4ECD6; --amber-line:#E6E6E6;
    --red:#000000; --red-wash:#F3C9B6;
    --radius:24px; --radius-sm:8px; --pill:50px; --shadow:none;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; padding:0 18px 60px; }
  .wrap { max-width:1080px; margin:0 auto; padding-top:24px; }
  .mono { font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }

  .searchbar { position:sticky; top:0; z-index:40; background:var(--bg); padding:14px 0 12px; margin:0 -18px 4px; border-bottom:1px solid var(--line); }
  .searchbar-inner { max-width:1080px; margin:0 auto; padding:0 18px; position:relative; }
  .search-input-wrap { position:relative; }
  .search-input-wrap .icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:15px; pointer-events:none; }
  #globalSearch { width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:11px 14px 11px 40px; border:1px solid var(--ink); border-radius:var(--pill); color:var(--ink); background:var(--card); }
  #globalSearch:focus { outline:2px solid var(--ink); outline-offset:1px; }
  #globalSearch::placeholder { color:var(--ink-faint); }
  .ac-list { position:absolute; left:18px; right:18px; top:calc(100% + 6px); background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 28px rgba(0,0,0,.12); max-height:380px; overflow-y:auto; display:none; z-index:45; }
  .ac-list.open { display:block; }
  .ac-item { padding:11px 15px; cursor:pointer; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .ac-item:last-child { border-bottom:none; }
  .ac-item:hover,.ac-item.active { background:var(--surface-soft); }
  .ac-item .ac-title { font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ac-item .ac-title mark { background:#FBE7A8; padding:0 1px; border-radius:2px; }
  .ac-item .ac-cost { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--money-deep); flex-shrink:0; }
  .ac-empty { padding:16px 15px; font-size:13px; color:var(--ink-faint); text-align:center; }

  .masthead { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .masthead h1 { font-family:'Inter',sans-serif; font-weight:700; font-size:25px; letter-spacing:-.01em; }
  .mh-switch { display:flex; gap:6px; flex-shrink:0; margin-top:12px; flex-wrap:wrap; }
  .mh-tab { font-family:'Inter',sans-serif; font-size:11px; font-weight:480; letter-spacing:.01em; color:var(--ink); padding:9px 18px; border-radius:var(--pill); text-decoration:none; border:1px solid var(--ink); background:var(--card); transition:all .15s; white-space:nowrap; }
  .mh-tab:hover { background:var(--surface-soft); }
  .mh-tab.active { background:var(--ink); border-color:var(--ink); color:#fff; }
  .masthead .meta { font-size:12px; color:var(--ink-faint); text-align:right; }
  .masthead .meta .mono { color:var(--ink); }

  .crumb { display:flex; align-items:center; gap:10px; margin-bottom:18px; font-size:13px; flex-wrap:wrap; }
  .crumb button { font-family:'Inter',sans-serif; font-size:13px; font-weight:540; color:var(--ink); background:transparent; border:none; cursor:pointer; padding:0; text-decoration:underline; }
  .crumb .sep { color:var(--ink-faint); } .crumb .cur { color:var(--ink); font-weight:540; }

  .strip { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:14px; }
  .strip .cell { background:var(--card); padding:16px 18px; }
  .strip .l { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); font-weight:540; margin-bottom:7px; display:flex; align-items:center; gap:5px; }
  .strip .v { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:21px; letter-spacing:-.02em; }
  .strip .v.exec { color:var(--money-deep); } .strip .v.gestao { color:var(--gestao); }
  .strip .v small { font-size:13px; color:var(--ink-faint); font-weight:400; }

  .info { display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:50%; border:1px solid var(--ink-faint); color:var(--ink-faint); font-size:10px; font-weight:700; cursor:pointer; }
  .info:hover,.info.on { border-color:var(--ink); color:var(--ink); }
  .tipbox { position:fixed; z-index:80; max-width:300px; background:var(--ink); color:#fff; font-size:12.5px; line-height:1.55; text-align:left; padding:13px 15px; border-radius:12px; box-shadow:0 10px 34px rgba(0,0,0,.28); display:none; }
  .tipbox.open { display:block; } .tipbox b { color:#fff; }
  .tip-backdrop { position:fixed; inset:0; z-index:79; display:none; } .tip-backdrop.open { display:block; }

  .honesty { background:var(--amber-wash); border:1px solid var(--amber-line); border-radius:var(--radius); padding:13px 18px; margin-bottom:24px; font-size:13px; color:#000; }
  .honesty strong { font-weight:700; }
  .connfail { background:var(--red-wash); border:1px solid var(--line); border-radius:var(--radius); padding:13px 18px; margin-bottom:16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .connfail .dot { width:9px; height:9px; border-radius:50%; background:#000; flex:none; }
  .connfail .ctext { flex:1; min-width:220px; font-size:13px; }
  .connfail .ctext .why { display:block; margin-top:3px; font-size:11.5px; color:var(--ink-faint); }
  .connfail button { font-family:'Inter',sans-serif; font-size:12.5px; font-weight:540; color:#000; background:transparent; border:1px solid #000; padding:7px 13px; border-radius:var(--pill); cursor:pointer; }

  .section-title { font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:400; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); margin:4px 0 12px; }
  .section-title.hero { font-family:'Inter',sans-serif; font-size:19px; font-weight:700; letter-spacing:-.01em; text-transform:none; color:var(--ink); margin:26px 0 14px; }
  /* Tabela de features vira cards empilhados no mobile */
  @media (max-width:720px){
    .feat-table thead { display:none; }
    .feat-table, .feat-table tbody, .feat-table tr, .feat-table td { display:block; width:100%; }
    .feat-table tr { border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:10px; background:var(--card); }
    .feat-table tr:hover { background:var(--card); }
    .feat-table td { border:none !important; padding:0 !important; text-align:left !important; }
    .feat-table td.num { text-align:left !important; }
    .feat-table td:first-child { margin-bottom:10px; }
    .feat-table tr { display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; }
    .feat-table td:first-child { grid-column:1 / -1; display:block; }
    .feat-table td:not(:first-child){ display:flex; justify-content:space-between; align-items:center; width:auto; margin-right:0; font-family:'JetBrains Mono',monospace; font-size:12.5px; padding:6px 9px !important; background:var(--surface-soft); border-radius:8px; }
    .feat-table td:not(:first-child)::before{ content:attr(data-label); color:var(--ink-faint); font-family:'Inter',sans-serif; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; margin-right:6px; }
    .feat-table .tbl-wrap::after{ display:none; }
    .feat-table.feat-table { min-width:0 !important; }
  }
  .home-search { position:relative; margin-bottom:12px; }
  .home-search .hs-icon { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:14px; pointer-events:none; }
  .home-search input { width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:11px 14px 11px 40px; border:1px solid var(--line); border-radius:var(--pill); color:var(--ink); background:var(--card); }
  .home-search input:focus { outline:2px solid var(--ink); outline-offset:1px; border-color:transparent; }
  .home-search input::placeholder { color:var(--ink-faint); }
  .m-sort { display:none; gap:6px; margin:-2px 0 14px; flex-wrap:wrap; align-items:center; }
  .m-sort .lbl { font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-right:2px; }
  .m-sort-pill { font-family:'Inter',sans-serif; font-size:12px; font-weight:480; padding:6px 13px; border-radius:var(--pill); border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  .m-sort-pill.active { background:var(--ink); border-color:var(--ink); color:#fff; }
  @media (max-width:720px){ .m-sort{ display:flex; } }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .navcard { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; cursor:pointer; transition:all .15s; text-align:left; font-family:inherit; width:100%; }
  .navcard:hover { border-color:var(--ink); }
  .navcard .nhead { font-family:'Inter',sans-serif; font-size:16px; font-weight:540; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .navcard .nhead .arrow { color:var(--ink-faint); font-size:15px; flex:none; }
  .navcard:hover .nhead .arrow { color:var(--ink); }
  .navcard .nsub { font-size:11.5px; color:var(--ink-faint); margin-bottom:14px; }
  .navcard .metrics { display:flex; gap:16px; flex-wrap:wrap; }
  .navcard .m .mv { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; white-space:nowrap; }
  .navcard .m .mv.exec { color:var(--money-deep); } .navcard .m .mv.gestao { color:var(--gestao); }
  .navcard .m .ml { font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; white-space:nowrap; }

  .costbar { display:flex; height:8px; border-radius:4px; overflow:hidden; margin-top:12px; background:var(--line); }
  .costbar > i.exec { background:var(--money); } .costbar > i.gestao { background:var(--gestao); }

  .dhead { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px 24px; margin-bottom:18px; }
  .dhead h2 { font-family:'Inter',sans-serif; font-size:22px; font-weight:700; margin-bottom:14px; }
  .dhead .row { display:flex; gap:30px; flex-wrap:wrap; }
  .dhead .m .mv { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px; }
  .dhead .m .mv.exec { color:var(--money-deep); } .dhead .m .mv.gestao { color:var(--gestao); }
  .dhead .m .ml { font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; display:flex; align-items:center; gap:5px; }

  .tbl-wrap { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tbl-wrap table { min-width:600px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th { text-align:left; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); font-weight:540; padding:13px 14px; border-bottom:1px solid var(--line); background:var(--surface-soft); white-space:nowrap; cursor:pointer; }
  thead th.num { text-align:right; }
  tbody td { padding:12px 14px; border-bottom:1px solid var(--line-soft); }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover { background:var(--surface-soft); }
  td.num { text-align:right; font-family:'JetBrains Mono',monospace; }
  td .nm { font-weight:480; } td .sq { font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .exec-txt { color:var(--money-deep); font-weight:540; } .gestao-txt { color:var(--gestao); font-weight:540; }
  .semtar { font-size:11px; color:var(--amber); font-style:italic; }
  .clickrow { cursor:pointer; }

  .state { text-align:center; padding:80px 20px; color:var(--ink-soft); }
  .state h2 { font-family:'Inter',sans-serif; font-size:18px; margin-bottom:10px; }
  .spinner { width:30px; height:30px; border:3px solid var(--line); border-top-color:var(--ink); border-radius:50%; margin:0 auto 20px; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media (max-width:720px){ .strip{ grid-template-columns:1fr 1fr;} .strip .cell:nth-child(3){ grid-column:1 / -1;} .grid{ grid-template-columns:1fr;} .dhead .row{ gap:18px;}
    .tbl-wrap{ position:relative;} .tbl-wrap::after{ content:''; position:absolute; top:0; right:0; bottom:0; width:22px; pointer-events:none; background:linear-gradient(to right,rgba(255,255,255,0),rgba(255,255,255,.95));} }
</style>
</head>
<body>
<div class="searchbar"><div class="searchbar-inner">
  <div class="search-input-wrap"><span class="icon">&#9906;</span>
    <input type="text" id="globalSearch" placeholder="Buscar feature pelo nome&hellip;" autocomplete="off" spellcheck="false"></div>
  <div class="ac-list" id="acList"></div>
</div></div>
<div class="wrap"><div id="app"><div class="state"><div class="spinner"></div><p>Carregando&hellip;</p></div></div></div>
<div class="tip-backdrop" id="tipBackdrop" onclick="fecharTip()"></div>
<div class="tipbox" id="tipBox"></div>

<script>
const ENDPOINT = "https://n8n-homolog.b2.club/webhook/esforco-dashboard";

const brl0 = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
function dataCurta(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?'—':d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
const numf = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1});
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let DATA=null, fetchErro=null;
let view='home', featAtual=null;
let ordTbl={campo:'custo',dir:-1};
let pagina=10; const PAGE=10;

async function carregar(){
  try{
    const r=await fetch(ENDPOINT,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let d=await r.json(); if(Array.isArray(d)) d=d[0];
    if(!d||!d.porFeature||!d.totais) throw new Error('formato inesperado');
    DATA=d; fetchErro=null; render();
  }catch(e){ console.warn('fallback:',e.message); DATA=__PV__; fetchErro=e.message; render(); }
}
function tentarNovamente(){ carregar(); }

const TIPS={
  p85:'Percentil 85: 85% das funcionalidades ficam abaixo deste valor. Mostra o "teto típico" de custo/esforço, ignorando os poucos outliers gigantes que distorceriam a média. Metade das features custa bem menos que isto.',
  exec:'Custo carregado = horas apontadas &times; (valorHora &divide; 0,60). O fator 0,60 reflete que a empresa paga 100% da jornada (8h/dia), mas ~60% vira desenvolvimento apontável. Cada hora entregue custa ~67% a mais que a tarifa de tabela — é o custo aproximado <b>mais real</b> da hora de dev.'
};
let tipAtual=null;
function toggleTip(ev,key){ ev.stopPropagation(); const box=document.getElementById('tipBox'),bd=document.getElementById('tipBackdrop'),el=ev.currentTarget;
  if(tipAtual===el){ fecharTip(); return; }
  document.querySelectorAll('.info.on').forEach(i=>i.classList.remove('on')); el.classList.add('on'); tipAtual=el;
  box.innerHTML=TIPS[key]||''; box.classList.add('open'); bd.classList.add('open');
  const r=el.getBoundingClientRect(),bw=Math.min(300,window.innerWidth-24); box.style.maxWidth=bw+'px';
  let left=r.left+r.width/2-bw/2; left=Math.max(12,Math.min(left,window.innerWidth-bw-12)); box.style.left=left+'px';
  const bh=box.offsetHeight; let top=r.top-bh-10; if(top<12) top=r.bottom+10; box.style.top=top+'px'; }
function fecharTip(){ document.getElementById('tipBox').classList.remove('open'); document.getElementById('tipBackdrop').classList.remove('open'); document.querySelectorAll('.info.on').forEach(i=>i.classList.remove('on')); tipAtual=null; }
function I(k){ return `<span class="info" onclick="toggleTip(event,'${k}')">i</span>`; }
window.addEventListener('scroll',()=>{ if(tipAtual) fecharTip(); },true);

function render(){ if(view==='home') renderHome(); else if(view==='featDetail') renderFeatDetail(); }

function masthead(){ const t=DATA.totais;
  return `<div class="masthead"><div><h1>Relatório de Custo das Implementações</h1>
    <div class="mh-switch"><a class="mh-tab active" href="index.html">Custo das Implementações</a><a class="mh-tab" href="dashboard-horas.html">Apontamento de Horas</a></div></div>
    <div class="meta">atualizado<br><span class="mono">${new Date(t.geradoEm).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div></div>`; }
function connBanner(){ if(!fetchErro) return ''; return `<div class="connfail"><span class="dot"></span><div class="ctext"><strong>Sem conexão com o n8n.</strong> Exibindo última cópia salva.<span class="why">${esc(fetchErro)}</span></div><button onclick="tentarNovamente()">Tentar de novo</button></div>`; }

function renderHome(){ view='home'; fecharTip(); const t=DATA.totais;
  const feats=featuresFiltradas();
  const visiveis=feats.slice(0,pagina);
  document.getElementById('app').innerHTML=`${masthead()}
    <div class="strip">
      <div class="cell"><div class="l">P85 custo ${I('p85')}</div><div class="v exec">${brl0.format(t.p85Custo)}</div></div>
      <div class="cell"><div class="l">P85 esforço ${I('p85')}</div><div class="v">${numf.format(t.p85Horas)}<small> h</small></div></div>
      <div class="cell"><div class="l">Features</div><div class="v">${t.features}</div></div>
    </div>${connBanner()}
    <div class="section-title hero">Escolha uma funcionalidade</div>
    <div class="home-search"><span class="hs-icon">&#9906;</span><input type="text" id="homeSearch" placeholder="Filtrar por nome da feature&hellip;" autocomplete="off" spellcheck="false" value="${esc(filtroHome)}"></div>
    <div class="m-sort"><span class="lbl">Ordenar</span>${mSortPill('custo','Custo')}${mSortPill('horas','Horas')}${mSortPill('qtdTasks','Tasks')}${mSortPill('ultimaAtividade','Data')}</div>
    <div class="tbl-wrap"><table class="feat-table"><thead><tr>
      <th onclick="setOrdHome('featureTitle')" style="cursor:pointer">Feature${arwH('featureTitle')}</th>
      <th class="num" onclick="setOrdHome('horas')" style="cursor:pointer">Horas${arwH('horas')}</th>
      <th class="num" onclick="setOrdHome('qtdTasks')" style="cursor:pointer">Tasks${arwH('qtdTasks')}</th>
      <th class="num" onclick="setOrdHome('ultimaAtividade')" style="cursor:pointer">Última em Done${arwH('ultimaAtividade')}</th>
      <th class="num" onclick="setOrdHome('custo')" style="cursor:pointer">Custo carregado${arwH('custo')}</th>
    </tr></thead><tbody id="featRows">
      ${visiveis.map(f=>linhaFeature(f)).join('')}
    </tbody></table></div>
    ${visiveis.length<feats.length?`<div id="sentinela" style="height:40px"></div>`:`<div style="text-align:center;padding:16px;font-size:12px;color:var(--ink-faint)">${feats.length} funcionalidades no total</div>`}`;
  // liga a busca da home
  const inp=document.getElementById('homeSearch');
  if(inp){ inp.addEventListener('input',()=>{ filtroHome=inp.value; pagina=PAGE; renderHome();
      const p=document.getElementById('homeSearch'); if(p){ p.focus(); p.setSelectionRange(p.value.length,p.value.length);} }); }
  ligarScrollInfinito();
}
function linhaFeature(f){
  return `<tr class="clickrow" onclick="abrirFeat(${f.featureId})">
    <td><div class="nm">${esc(f.featureTitle)}</div><div class="sq">${esc(f.squad)}${f.semTarifa?' &middot; <span class="semtar">tem gente sem tarifa</span>':''}</div></td>
    <td class="num" data-label="Horas">${numf.format(f.horas)}</td>
    <td class="num" data-label="Tasks">${f.qtdTasks}</td>
    <td class="num" data-label="Done">${dataCurta(f.ultimaAtividade)}</td>
    <td class="num" data-label="Custo"><span class="exec-txt">${brl0.format(f.custo)}</span></td>
  </tr>`;
}
function featuresFiltradas(){
  const q=normStr(filtroHome);
  let arr=[...DATA.porFeature];
  if(q.length>=1) arr=arr.filter(f=>normStr(f.featureTitle).includes(q));
  const {campo,dir}=ordTbl;
  arr.sort((a,b)=>{
    let va=a[campo], vb=b[campo];
    if(campo==='featureTitle'){ va=normStr(va); vb=normStr(vb); return va<vb?-dir:va>vb?dir:0; }
    if(campo==='ultimaAtividade'){ va=va||''; vb=vb||''; return va<vb?-dir:va>vb?dir:0; }
    va=va==null?-1:va; vb=vb==null?-1:vb; return (va-vb)*dir;
  });
  return arr;
}
function setOrdHome(campo){
  if(ordTbl.campo===campo) ordTbl.dir*=-1;
  else ordTbl={campo, dir:(campo==='featureTitle'?1:-1)};
  pagina=PAGE; renderHome();
}
