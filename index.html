<style>
  :root {
    --bg: #FFFFFF; --card: #FFFFFF; --ink: #000000; --ink-soft: #000000; --ink-faint: #6B6B6B;
    --line: #E6E6E6; --line-soft: #F1F1F1; --surface-soft: #F7F7F5;

    --magenta: #FF3D8B;
    --radius: 24px; --radius-sm: 8px; --pill: 50px; --shadow: none;
  }
  /* Alternador de visão, integrado ao masthead */
  .mh-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 5px; }
  .mh-switch { display: flex; gap: 6px; flex-shrink: 0; margin-top: 12px; }
  .mh-tab { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 480; letter-spacing: .01em; color: var(--ink); padding: 9px 18px; border-radius: var(--pill); text-decoration: none; border: 1px solid var(--ink); background: var(--card); transition: all .15s; white-space: nowrap; }
  .mh-tab:hover { background: var(--surface-soft); }
  .mh-tab.active { background: var(--ink); border-color: var(--ink); color: #fff; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; padding: 0 18px 60px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding-top: 24px; }

  /* Busca global fixa */
  .searchbar { position: sticky; top: 0; z-index: 40; background: var(--bg); padding: 14px 0 12px; margin: 0 -18px 4px; border-bottom: 1px solid var(--line); }
  .searchbar-inner { max-width: 1080px; margin: 0 auto; padding: 0 18px; position: relative; }
  .search-input-wrap { position: relative; }
  .search-input-wrap .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); font-size: 15px; pointer-events: none; }
  #globalSearch {
    width: 100%; font-family: 'Inter', sans-serif; font-size: 14px;
    padding: 11px 14px 11px 40px; border: 1px solid var(--line); border-radius: 10px;
    color: var(--ink); background: var(--card); box-shadow: var(--shadow);
  }
  #globalSearch:focus { outline: 2px solid var(--money); outline-offset: 1px; border-color: transparent; }
  #globalSearch::placeholder { color: var(--ink-faint); }

  .ac-list {
    position: absolute; left: 18px; right: 18px; top: calc(100% + 6px);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.12); max-height: 380px; overflow-y: auto;
    display: none; z-index: 45;
  }
  .ac-list.open { display: block; }
  .ac-item { padding: 11px 15px; cursor: pointer; border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.active { background: var(--money-wash); }
  .ac-item .ac-title { font-size: 13.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ac-item .ac-title mark { background: #FBE7A8; color: inherit; padding: 0 1px; border-radius: 2px; }
  .ac-item .ac-meta { flex-shrink: 0; text-align: right; }
  .ac-item .ac-squad { font-size: 10.5px; color: var(--ink-faint); padding: 1px 7px; border: 1px solid var(--line); border-radius: 10px; white-space: nowrap; }
  .ac-item .ac-cost { font-family:'JetBrains Mono',monospace; font-size: 11.5px; color: var(--money-deep); margin-top: 3px; }
  .ac-empty { padding: 16px 15px; font-size: 13px; color: var(--ink-faint); text-align: center; }

  /* destaque temporário na feature aberta via busca */
  .feat.flash { animation: flash 1.6s ease; }
  @keyframes flash { 0%,40% { box-shadow: 0 0 0 2px var(--money), var(--shadow); } 100% { box-shadow: var(--shadow); } }
  .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

  /* Masthead */
  .masthead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .masthead .eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; margin-bottom: 5px; }
  .masthead h1 { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 25px; letter-spacing: -.01em; }
  .masthead .meta { font-size: 12px; color: var(--ink-faint); text-align: right; }
  .masthead .meta .mono { color: var(--ink-soft); }

  /* Breadcrumb / back */
  .crumb { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font-size: 13px; }
  .crumb button { font-family: 'Inter',sans-serif; font-size: 13px; font-weight: 600; color: var(--money); background: transparent; border: none; cursor: pointer; padding: 0; display: inline-flex; align-items: center; gap: 5px; }
  .crumb button:hover { text-decoration: underline; }
  .crumb .sep { color: var(--ink-faint); }
  .crumb .cur { color: var(--ink); font-weight: 600; }

  /* Totals strip (home) */

  .strip .l { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; margin-bottom: 7px; }
  .strip .v { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 22px; letter-spacing: -.02em; }
  .strip .v.money { color: var(--money-deep); }
  .strip .v small { font-size: 13px; color: var(--ink-faint); font-weight: 400; }

  /* Honesty */
  .honesty { background: var(--amber-wash); border: 1px solid var(--amber-line); border-radius: var(--radius); padding: 13px 18px; margin-bottom: 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .honesty .gtext { flex: 1; min-width: 200px; font-size: 13px; color: #6B5220; }
  .honesty .gtext strong { color: var(--amber); }
  .honesty button { font-family:'Inter',sans-serif; font-size: 12.5px; font-weight: 600; color: var(--amber); background: transparent; border: 1px solid var(--amber-line); padding: 7px 13px; border-radius: 8px; cursor: pointer; }
  .honesty button:hover { background: #EFDDBD; }
  /* Banner de erro de conexão com o endpoint */
  .connfail { background: #FDECEC; border: 1px solid #F3C0C0; border-radius: var(--radius); padding: 13px 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .connfail .dot { width: 9px; height: 9px; border-radius: 50%; background: #C0392B; flex: none; box-shadow: 0 0 0 4px rgba(192,57,43,.14); }
  .connfail .ctext { flex: 1; min-width: 220px; font-size: 13px; color: #7A2E23; }
  .connfail .ctext strong { color: #C0392B; }

  .connfail button { font-family:'Inter',sans-serif; font-size: 12.5px; font-weight: 600; color: #C0392B; background: transparent; border: 1px solid #F3C0C0; padding: 7px 13px; border-radius: 8px; cursor: pointer; }
  .connfail button:hover { background: #F9DCDC; }

  .section-title { font-family:'JetBrains Mono',monospace; font-size: 11.5px; font-weight: 400; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); margin: 4px 0 12px; }

  /* Squad cards (home) */
  .squad-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(265px, 1fr)); gap: 12px; }
  .squad-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; cursor: pointer; transition: all .15s; box-shadow: var(--shadow); text-align: left; font-family: inherit; }
  .squad-card:hover { border-color: var(--ink); }
  .squad-card .sname { font-family:'Inter',sans-serif; font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .squad-card .sname .arrow { color: var(--ink-faint); font-size: 15px; transition: transform .15s; }

  .squad-card .m { min-width: 0; flex: 0 1 auto; }
  .squad-card .m .mv { font-family:'JetBrains Mono',monospace; font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }

  .squad-card .m .mv.zero { color: var(--amber); font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .squad-card .m .ml { font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; white-space: nowrap; }
  .squad-card .last { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-soft); font-size: 11.5px; color: var(--ink-faint); }
  .squad-card .last .mono { color: var(--ink-soft); }
  .squad-card.zero { opacity: .72; }
  .squad-card.zero .mv.money { color: var(--amber); }

  /* Squad detail header */
  .sqhead { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .sqhead h2 { font-family:'Inter',sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 14px; }
  .sqhead .row { display: flex; gap: 32px; flex-wrap: wrap; }
  .sqhead .m .mv { font-family:'JetBrains Mono',monospace; font-weight: 700; font-size: 20px; }
  .sqhead .m .mv.money { color: var(--money-deep); }
  .sqhead .m .ml { font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }

  .sort-note { font-size: 12px; color: var(--ink-faint); margin-bottom: 12px; display:flex; align-items:center; gap:6px; }

  /* Feature card (in squad detail) */

  .feat-head { padding: 16px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; transition: background .12s; }
  .feat-head:hover { background: #FBFCFB; }
  .feat-head .fleft { flex: 1; min-width: 0; }
  .feat-head .ftitle { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 6px; line-height: 1.35; }
  .feat-head .fmeta { font-size: 12px; color: var(--ink-faint); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .feat-head .fmeta .recent { color: var(--money); font-weight: 500; }
  .feat-head .fright { flex-shrink: 0; text-align: right; }
  .feat-head .fcost { font-family:'JetBrains Mono',monospace; font-weight: 700; font-size: 17px; color: var(--money-deep); }
  .feat-head .fcost.zero { color: var(--amber); font-size: 13px; font-weight: 500; }
  .feat-head .fhours { font-family:'JetBrains Mono',monospace; font-size: 12px; color: var(--ink-faint); margin-top: 3px; }
  .feat-head .chev { color: var(--ink-faint); font-size: 13px; margin-left: 4px; transition: transform .18s; display:inline-block; }
  .feat.open .chev { transform: rotate(90deg); }

  .feat-tasks { display: none; padding: 0 20px 8px; border-top: 1px solid var(--line-soft); }
  .feat.open .feat-tasks { display: block; }
  .task { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
  .task:last-child { border-bottom: none; }
  .task .tleft { flex: 1; min-width: 0; }
  .task .ttitle { font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task .tsub { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; }
  .task .tsub .who { color: var(--effort); font-weight: 500; }
  .task .tbadge { font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--line); color: var(--ink-faint); margin-right: 6px; }
  .task .thours { font-family:'JetBrains Mono',monospace; font-size: 12px; color: var(--ink-faint); flex-shrink: 0; }
  .feat-more { font-size: 11.5px; color: var(--ink-faint); padding: 8px 0 4px; }

  /* Sort toggle */
  .sortbar { display: flex; gap: 7px; margin-bottom: 14px; }
  .sortbtn { font-family:'Inter',sans-serif; font-size: 12.5px; font-weight: 500; padding: 6px 13px; border-radius: 20px; cursor: pointer; background: var(--card); border: 1px solid var(--line); color: var(--ink-soft); transition: all .13s; }
  .sortbtn:hover { border-color: var(--ink); color: var(--ink); }
  .sortbtn.active { background: var(--money-deep); border-color: var(--money-deep); color: #fff; }

  /* States */
  .state { text-align: center; padding: 80px 20px; color: var(--ink-soft); }
  .state h2 { font-family:'Inter',sans-serif; font-size: 18px; margin-bottom: 10px; color: var(--ink); }

  .spinner { width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--money); border-radius: 50%; margin: 0 auto 20px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; place-items: center; padding: 20px; z-index: 50; }
  .modal-bg.open { display: grid; }
  .modal { background: var(--card); border-radius: var(--radius); max-width: 520px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 24px 26px; }
  .modal h3 { font-family:'Inter',sans-serif; font-size: 17px; margin-bottom: 4px; }
  .modal .msub { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
  .modal .prow { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
  .modal .prow:last-child { border: none; }
  .modal .prow .h { font-family:'JetBrains Mono',monospace; color: var(--amber); font-weight: 600; }
  .modal .close { float: right; cursor: pointer; border: none; background: none; font-size: 20px; color: var(--ink-faint); line-height: 1; }

  @media (max-width: 720px) {
    .strip { grid-template-columns: 1fr 1fr; }
    .sqhead .row { gap: 20px; }
    .squad-grid { grid-template-columns: 1fr; }
    .squad-card .metrics { gap: 20px; }
  }
</style>

  return `<div class="masthead">
      <div>
        <h1>Relatório de Custos Diretos do Time</h1>
        <div class="mh-switch"><a class="mh-tab " href="dashboard-horas.html">Apontamento de Horas</a><a class="mh-tab active" href="index.html">Custo das Implementações</a></div>
      </div>
      <div class="meta">atualizado<br><span class="mono">${new Date(DATA.geradoEm).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div>
    </div>`;
}
function renderHome() {
  view = 'home';
  const t = DATA.totais, a = DATA.alertas;
  const pct = Math.round(a.horasSemCusto / t.horas * 100);
  const squads = ordenarSquads(DATA.porSquad, ordSquad);

  document.getElementById('app').innerHTML = `
    ${masthead()}

    <div class="strip">
      <div class="cell"><div class="l">Custo medido</div><div class="v money">${brl0.format(t.custo)}</div></div>
      <div class="cell"><div class="l">Esforço total</div><div class="v">${numf.format(t.horas)}<small> h</small></div></div>
      <div class="cell"><div class="l">Features</div><div class="v">${t.features}</div></div>
      <div class="cell"><div class="l">Squads</div><div class="v">${DATA.porSquad.length}</div></div>
    </div>

    ${fetchErro ? `
    <div class="connfail">
      <span class="dot"></span>
      <div class="ctext"><strong>Sem conexão com o n8n.</strong> Exibindo a última cópia salva de ${new Date(DATA.geradoEm).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})} — os números podem estar desatualizados.<span class="why">Detalhe técnico: ${esc(fetchErro)}</span></div>
      <button onclick="tentarNovamente()">Tentar de novo</button>
    </div>` : ''}

    ${a.custoSubestimado ? `
    <div class="honesty">
      <div class="gtext"><strong>${pct}% do esforço ainda não tem custo.</strong> ${numf.format(a.horasSemCusto)} h de ${a.totalPessoasSemTarifa} pessoas sem tarifa — o custo real é maior.</div>
      <button onclick="abrirModal()">Ver quem falta</button>
    </div>` : ''}

    <div class="section-title">Escolha um squad</div>
    <div class="sortbar" style="margin-bottom:14px">
      <button class="sortbtn ${ordSquad==='recente'?'active':''}" onclick="setOrdSquad('recente')">Atividade recente</button>
      <button class="sortbtn ${ordSquad==='custo'?'active':''}" onclick="setOrdSquad('custo')">Maior custo</button>
      <button class="sortbtn ${ordSquad==='esforco'?'active':''}" onclick="setOrdSquad('esforco')">Maior esforço</button>
      <button class="sortbtn ${ordSquad==='media'?'active':''}" onclick="setOrdSquad('media')">Custo médio / feature</button>
    </div>
    ${(ordSquad==='custo'||ordSquad==='media') ? `<div class="sort-note">↓ Squads sem tarifa cadastrada vão para o fim — têm esforço, mas o custo ainda não foi medido.</div>` : ''}
    <div class="squad-grid">
      ${squads.map(s => {
        const media = s.qtdFeatures ? s.custo / s.qtdFeatures : 0;
        return `
        <button class="squad-card ${s.custo===0?'zero':''}" onclick="abrirSquad('${esc(s.squad).replace(/'/g,"\\'")}')">
          <div class="sname">${esc(s.squad)} <span class="arrow">→</span></div>
          <div class="metrics">
            <div class="m"><div class="mv ${s.custo===0?'zero':'money'}">${s.custo===0?'s/&nbsp;tarifa':brl0.format(s.custo)}</div><div class="ml">custo</div></div>
            <div class="m"><div class="mv">${numf.format(s.horas)}</div><div class="ml">horas</div></div>
            <div class="m"><div class="mv">${s.qtdFeatures}</div><div class="ml">features</div></div>
          </div>
          ${ordSquad==='media' ? `<div class="last">${s.custo===0?'sem tarifa — não calculável':'<span class="mono" style="color:var(--money-deep);font-weight:700">'+brl0.format(media)+'</span> médio por feature'}</div>` : `<div class="last">última entrega <span class="mono">${tempoRel(s.ultimaAtividade)}</span></div>`}
        </button>
      `;}).join('')}
    </div>
  `;
}

function setOrdSquad(o){ ordSquad = o; renderHome(); window.scrollTo(0,0); }
function ordenarSquads(lista, modo){
  const arr = lista.slice();
  if (modo === 'recente') {
    arr.sort((x,y)=> String(y.ultimaAtividade||'').localeCompare(String(x.ultimaAtividade||'')));
  } else if (modo === 'esforco') {
    arr.sort((x,y)=> (y.horas||0) - (x.horas||0));
  } else if (modo === 'custo') {
    // squads sem custo medido (s/ tarifa) vão para o fim, ordenados entre si por esforço
    arr.sort((x,y)=>{
      const xz = (x.custo||0)===0, yz = (y.custo||0)===0;
      if (xz !== yz) return xz ? 1 : -1;
      if (xz && yz) return (y.horas||0) - (x.horas||0);
      return (y.custo||0) - (x.custo||0);
    });
  } else if (modo === 'media') {
    const media = s => (s.qtdFeatures ? (s.custo||0)/s.qtdFeatures : 0);
    arr.sort((x,y)=>{
      const xz = (x.custo||0)===0, yz = (y.custo||0)===0;
      if (xz !== yz) return xz ? 1 : -1;
      if (xz && yz) return (y.horas||0) - (x.horas||0);
      return media(y) - media(x);
    });
  }
  return arr;
}
function abrirSquad(nome) { squadAtual = nome; ordenacao = 'recente'; renderSquad(); window.scrollTo(0,0); }

function renderSquad() {
  view = 'squad';
  const s = DATA.porSquad.find(x => x.squad === squadAtual);
  let feats = DATA.porFeature.filter(f => f.squad === squadAtual);

  if (ordenacao === 'recente') {
    feats.sort((a,b)=> String(b.ultimaAtividade||'').localeCompare(String(a.ultimaAtividade||'')));
  } else {
    feats.sort((a,b)=> b.custo - a.custo);
  }

  document.getElementById('app').innerHTML = `
    ${masthead()}

    <div class="crumb">
      <button onclick="renderHome()">← Todos os squads</button>
      <span class="sep">/</span>
      <span class="cur">${esc(squadAtual)}</span>
    </div>

    <div class="sqhead">
      <h2>${esc(squadAtual)}</h2>
      <div class="row">
        <div class="m"><div class="mv money">${s.custo===0?'sem tarifa':brl0.format(s.custo)}</div><div class="ml">custo medido</div></div>
        <div class="m"><div class="mv">${numf.format(s.horas)} h</div><div class="ml">esforço</div></div>
        <div class="m"><div class="mv">${s.qtdFeatures}</div><div class="ml">features</div></div>
        <div class="m"><div class="mv" style="font-size:15px">${tempoRel(s.ultimaAtividade)}</div><div class="ml">última entrega</div></div>
      </div>
    </div>

    <div class="sortbar">
      <button class="sortbtn ${ordenacao==='recente'?'active':''}" onclick="setOrd('recente')">Mais recentes</button>
      <button class="sortbtn ${ordenacao==='custo'?'active':''}" onclick="setOrd('custo')">Maior custo</button>
    </div>

    <div id="featList">
      ${feats.map((f, i) => featCard(f, i)).join('')}
    </div>
  `;
}
function setOrd(o){ ordenacao = o; renderSquad(); }

function featCard(f, idx) {
  const tasksHtml = f.tasks.map(t => `
    <div class="task">
      <div class="tleft">
        <div class="ttitle">${esc(t.titulo || '(sem título)')}</div>
        <div class="tsub"><span class="tbadge">${esc(t.tipo)}</span><span class="who">${esc(t.pessoa)}</span> · concluída ${tempoRel(t.concluidaEm)} <span class="mono">(${dataCurta(t.concluidaEm)})</span></div>
      </div>
      <div class="thours">${hrs(t.horas)}</div>
    </div>
  `).join('');
  const maisTasks = f.qtdTasks > f.tasks.length ? `<div class="feat-more">+ ${f.qtdTasks - f.tasks.length} outras tasks concluídas</div>` : '';
  return `
    <div class="feat" id="feat-${idx}">
      <div class="feat-head" onclick="toggleFeat(${idx})">
        <div class="fleft">
          <div class="ftitle">${esc(f.featureTitle)}</div>
          <div class="fmeta">
            <span class="recent">atividade ${tempoRel(f.ultimaAtividade)}</span>
            <span>${f.qtdTasks} task${f.qtdTasks!==1?'s':''}</span>
          </div>
        </div>
        <div class="fright">
          <div class="fcost ${f.custo===0?'zero':''}">${f.custo===0?'sem tarifa':brl0.format(f.custo)}</div>
          <div class="fhours">${hrs(f.horas)}</div>
        </div>
        <span class="chev">▶</span>
      </div>
      <div class="feat-tasks">
        ${tasksHtml}
        ${maisTasks}
      </div>
    </div>`;
}
function toggleFeat(idx) { document.getElementById('feat-'+idx).classList.toggle('open'); }

// ====== MODAL ======
function abrirModal() {
  document.getElementById('modalList').innerHTML = DATA.alertas.pessoasSemTarifa.map(p =>
    `<div class="prow"><span>${esc(p.assignedTo)} <span style="color:var(--ink-faint); font-size:11.5px">${esc(p.assignedToEmail)}</span></span><span class="h">${hrs(p.horasSemCusto)}</span></div>`
  ).join('');
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').addEventListener('click', e => { if(e.target.id==='modalBg') closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ====== BUSCA GLOBAL COM AUTOCOMPLETE ======
let acResultados = [];
let acAtivo = -1;

function normaliza(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function destacar(titulo, termo){
  const t = esc(titulo);
  if (!termo) return t;
  const nt = normaliza(titulo), ntermo = normaliza(termo);
  const idx = nt.indexOf(ntermo);
  if (idx < 0) return t;
  // reconstrói destacando a faixa correspondente (posições batem com o texto original)
  return esc(titulo.slice(0,idx)) + '<mark>' + esc(titulo.slice(idx, idx+termo.length)) + '</mark>' + esc(titulo.slice(idx+termo.length));
}

function buscarFeatures(termo){
  const q = normaliza(termo);
  if (q.length < 2) return [];
  return DATA.porFeature
    .filter(f => normaliza(f.featureTitle).includes(q))
    .slice(0, 20);
}

function renderAC(){
  const el = document.getElementById('acList');
  if (acResultados.length === 0) {
    const termo = document.getElementById('globalSearch').value;
    if (normaliza(termo).length >= 2) {
      el.innerHTML = `<div class="ac-empty">Nenhuma feature encontrada.</div>`;
      el.classList.add('open');
    } else { el.classList.remove('open'); }
    return;
  }
  const termo = document.getElementById('globalSearch').value;
  el.innerHTML = acResultados.map((f, i) => `
    <div class="ac-item ${i===acAtivo?'active':''}" data-idx="${i}" onmousedown="selecionarAC(${i})">
      <span class="ac-title">${destacar(f.featureTitle, termo)}</span>
      <span class="ac-meta">
        <span class="ac-squad">${esc(f.squad)}</span>
        <div class="ac-cost">${f.custo===0?'sem tarifa':brl0.format(f.custo)}</div>
      </span>
    </div>`).join('');
  el.classList.add('open');
}

function selecionarAC(i){
  const f = acResultados[i];
  if (!f) return;
  document.getElementById('globalSearch').value = '';
  document.getElementById('acList').classList.remove('open');
  acResultados = []; acAtivo = -1;
  irParaFeature(f);
}

function irParaFeature(f){
  // abre o squad da feature
  squadAtual = f.squad;
  ordenacao = 'recente';
  renderSquad();
  window.scrollTo(0,0);
  // encontra o índice da feature na lista renderizada e expande + destaca
  const feats = DATA.porFeature.filter(x => x.squad === f.squad)
    .sort((a,b)=> String(b.ultimaAtividade||'').localeCompare(String(a.ultimaAtividade||'')));
  const idx = feats.findIndex(x => x.featureId === f.featureId);
  if (idx >= 0) {
    setTimeout(() => {
      const card = document.getElementById('feat-'+idx);
      if (card) {
        card.classList.add('open');
        card.classList.add('flash');
        card.scrollIntoView({ behavior:'smooth', block:'center' });
        setTimeout(()=>card.classList.remove('flash'), 1700);
      }
    }, 60);
  }
}

function initBusca(){
  const inp = document.getElementById('globalSearch');
  const el = document.getElementById('acList');
  inp.addEventListener('input', () => {
    acResultados = buscarFeatures(inp.value);
    acAtivo = -1;
    renderAC();
  });
  inp.addEventListener('keydown', (e) => {
    if (!el.classList.contains('open')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); acAtivo = Math.min(acAtivo+1, acResultados.length-1); renderAC(); scrollAC(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); acAtivo = Math.max(acAtivo-1, 0); renderAC(); scrollAC(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (acAtivo>=0) selecionarAC(acAtivo); else if (acResultados.length) selecionarAC(0); }
    else if (e.key === 'Escape') { el.classList.remove('open'); inp.blur(); }
  });
  inp.addEventListener('blur', () => setTimeout(()=>el.classList.remove('open'), 150));
  inp.addEventListener('focus', () => { if (acResultados.length) el.classList.add('open'); });
}
function scrollAC(){
  const item = document.querySelector('.ac-item.active');
  if (item) item.scrollIntoView({ block:'nearest' });
}

carregar();
initBusca();
</script>
